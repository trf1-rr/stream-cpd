services:
  stream:
    build: .
    container_name: stream-cpd
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # segmentos HLS vivem em RAM: nao desgasta disco e some no restart
    tmpfs:
      - /tmp/hls:size=256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
